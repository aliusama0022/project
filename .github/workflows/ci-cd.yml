name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r flask-app/requirements.txt
        pip install pytest pytest-cov
    
    - name: Run tests
      run: |
        cd flask-app
        python -m pytest --cov=src tests/ || echo "No tests found, skipping..."
    
    - name: Lint with flake8
      run: |
        pip install flake8
        flake8 flask-app/src --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 flask-app/src --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  build:
    needs: test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image
      run: |
        docker build -t flask-app:latest .
    
    - name: Test Docker image
      run: |
        docker run -d -p 5000:5000 --name test-app flask-app:latest
        sleep 10
        curl -f http://localhost:5000/ || exit 1
        docker stop test-app
        docker rm test-app

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login to Docker Hub (Optional)
      if: ${{ secrets.DOCKER_USERNAME && secrets.DOCKER_PASSWORD }}
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Build and push Docker image
      if: ${{ secrets.DOCKER_USERNAME && secrets.DOCKER_PASSWORD }}
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/flask-app:latest .
        docker push ${{ secrets.DOCKER_USERNAME }}/flask-app:latest
    
    - name: Deploy to production (placeholder)
      run: |
        echo "Add your deployment commands here"
        echo "For example: deploy to AWS, DigitalOcean, etc."
